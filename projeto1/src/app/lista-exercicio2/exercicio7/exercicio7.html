<h2>Lista de disciplinas</h2>

<ul>
  <li
    *ngFor="let disciplina of disciplinas; let i = index; let primeiro = first; let ultimo = last"
    [ngClass]="{
      'par': i % 2 == 0,
      'impar': i % 2 != 0,
      'primeiro': primeiro,
      'ultimo': ultimo
    }">

    {{ i + 1 }} - {{ disciplina }}

  </li>
</ul>
